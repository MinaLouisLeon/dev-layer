name: release

# Pushing to main publishes a fresh Windows installer. Version tags (v1.2.3)
# publish a permanent release instead; pull requests build the installer and
# attach it to the run without publishing anything.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same ref makes an in-flight build pointless.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # The only place the unit tests actually run: every other CI job is on
      # Linux, where the Tauri dependency chain cannot build.
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

