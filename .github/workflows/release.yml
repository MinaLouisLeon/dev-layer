name: release

# Pushing to main publishes a fresh Windows installer. Version tags (v1.2.3)
# publish a permanent release instead; pull requests build the installer and
# attach it to the run without publishing anything.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same ref makes an in-flight build pointless.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # The only place the tests actually run: every other CI job is on
      # Linux, where the Tauri dependency chain cannot build. `--workspace` is
      # load-bearing - without it cargo tests the root package alone and the
      # vendored `mino-core` crate compiles but never runs a single test.
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Decide what this run publishes
        id: meta
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")

          # Every branch writes every key: tauri-action parses `prerelease` as
          # a strict YAML boolean and rejects an empty string, so an unset
          # output fails the step before the build even starts.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # A version tag is a permanent release.
            tag="$GITHUB_REF_NAME"
            name="dev-layer $GITHUB_REF_NAME"
            prerelease=false
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Build only: an empty tag tells tauri-action not to publish.
            tag=""
            name=""
            prerelease=false
          else
            # Rolling build of main. Tagged "nightly" rather than "main" so the
            # tag can never be confused with the branch of the same name.
            tag="nightly"
            name="dev-layer nightly (v$version)"
            prerelease=true
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "name=$name"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      # tauri-action reuses an existing release rather than replacing it, and a
      # rolling tag would keep pointing at an old commit. Removing it first
      # makes every main build a clean publish at the current commit.
      - name: Clear the previous nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete nightly --yes --cleanup-tag || true

      - name: Build the installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          releaseDraft: false
          releaseBody: |
            Windows installer for dev-layer v${{ steps.meta.outputs.version }},
            built from ${{ github.sha }}.

            Download `dev-layer_${{ steps.meta.outputs.version }}_x64-setup.exe`
            and run it. The installer is per-user, so no administrator prompt.
            Windows SmartScreen will warn on first run: the build is unsigned.

            Exit dev-layer with `Ctrl+Alt+Shift+Q` — it restores the taskbar and
            every window it moved.
          args: --bundles nsis

      # Pull requests get the installer without a release, so a change can be
      # tried on a real machine before it is merged.
      - name: Attach the installer to the run
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dev-layer-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
