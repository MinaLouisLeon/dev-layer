name: check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build

  rust:
    # The Win32 path is type-checked from Linux: cheap, and it catches the
    # platform code breaking without needing a Windows runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Cross-compiling to windows-msvc runs tauri-winres, which shells out to
      # llvm-rc to embed the icon and version resource into the binary. Ubuntu
      # ships it under a versioned name only, so expose an unversioned alias —
      # without it the build script panics with NotAttempted("llvm-rc").
      - name: Provide the Windows resource compiler
        run: |
          if ! command -v llvm-rc >/dev/null; then
            if ! ls /usr/bin/llvm-rc-* >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y llvm
            fi
            sudo ln -sf "$(ls /usr/bin/llvm-rc-* | sort -V | tail -1)" /usr/local/bin/llvm-rc
          fi
          command -v llvm-rc
      - run: npm ci && npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --all-targets
