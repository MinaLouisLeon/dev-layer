[package]
name = "dev-layer"
version = "0.1.0"
description = "Fullscreen developer HUD that overlays Windows"
edition = "2021"
rust-version = "1.85"

[lib]
name = "dev_layer_lib"

# mino-core is vendored from github.com/MinaLouisLeon/mino-workbench (MIT) so
# the workbench ships inside dev-layer as one app and one installer, rather
# than as a second program to install. See crates/mino-core/LICENSE.
[workspace]
members = ["crates/mino-core"]

# Consumed only by the vendored crate, which declares these as workspace
# inherits. dev-layer's own package sets its own values above.
[workspace.package]
version = "0.1.6"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1.83"
base64 = "0.22.1"
portable-pty = "0.9"
russh = "0.49.0"
russh-sftp = "2.0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24.0"
tracing = "0.1"
ts-rs = { version = "10.1.0", features = ["serde-json-impl", "no-serde-warnings"] }
uuid = { version = "1", features = ["v4", "serde"] }
which = "8"

[dependencies]
mino-core = { path = "crates/mino-core" }
base64 = "0.23.1"
ctrlc = "3.5.2"
parking_lot = "0.12.5"
png = "0.18.1"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "gzip", "http2", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.36.1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "8.0.6"

[build-dependencies]
tauri-build = "2"

[target."cfg(windows)".dependencies]
nvml-wrapper = { version = "0.13.0", optional = true }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_UI_Shell_Common", "Win32_UI_Controls", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_Graphics_Dwm", "Win32_UI_Accessibility", "Win32_System_Threading"] }

[features]
default = ["nvidia"]
# NVIDIA telemetry via NVML. Optional so the build works without the NVIDIA
# SDK present; the PDH backend covers every other GPU either way.
nvidia = ["dep:nvml-wrapper"]
