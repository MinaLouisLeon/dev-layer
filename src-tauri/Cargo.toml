[package]
name = "dev-layer"
version = "0.1.0"
description = "Fullscreen developer HUD that overlays Windows"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dev_layer_lib"

[dependencies]
ctrlc = "3.5.2"
parking_lot = "0.12.5"
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.36.1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tauri-build = "2"

[target."cfg(windows)".dependencies]
nvml-wrapper = { version = "0.13.0", optional = true }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_UI_Shell_Common", "Win32_UI_Controls", "Win32_System_Com", "Win32_Storage_FileSystem"] }

[features]
default = ["nvidia"]
# NVIDIA telemetry via NVML. Optional so the build works without the NVIDIA
# SDK present; the PDH backend covers every other GPU either way.
nvidia = ["dep:nvml-wrapper"]
